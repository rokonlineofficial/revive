name: Build for Hostinger

# Hostinger's Git deploy copies the repo without building it.
# This rebuilds the site into /site and commits it if it is out of date,
# so the live site always matches the latest code.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:hostinger

      - name: Commit updated build
        run: |
          git add -A site
          if git diff --cached --quiet; then
            echo "Build is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Hostinger build [skip ci]"
          git push
