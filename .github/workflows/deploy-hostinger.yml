name: Build for Hostinger

# Builds the site and publishes the ready-to-serve files (dist/) to the
# `hostinger-build` branch. Hostinger's Git deployment pulls from that branch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish built site to hostinger-build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger-build
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Build from"
